<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Demo</title>
  <style>
    :root { --bg:#0d1117; --card:#161b22; --border:#30363d; --text:#e6edf3; --muted:#8b949e; --accent:#2f81f7; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
    }
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 32px; width: 100%; max-width: 420px; text-align: center;
    }
    h1 { font-size: 1.6rem; margin-bottom: 8px; }
    p { color: var(--muted); margin-bottom: 24px; line-height: 1.5; }
    .counter { font-size: 3rem; font-weight: 700; margin-bottom: 24px; color: var(--accent); }
    .buttons { display: flex; gap: 8px; justify-content: center; margin-bottom: 24px; }
    button {
      background: var(--accent); color: #fff; border: none; border-radius: 6px;
      padding: 10px 18px; font-size: 1rem; cursor: pointer; transition: opacity .15s;
    }
    button:hover { opacity: .85; }
    button.secondary { background: transparent; border: 1px solid var(--border); color: var(--text); }
    a { color: var(--accent); text-decoration: none; font-size: .9rem; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main class="card">
    <h1>🚀 My Project</h1>
    <p>A tiny interactive demo. Replace this text with a short description of your project.</p>

    <div class="counter" id="count">0</div>
    <div class="buttons">
      <button id="dec" class="secondary">−</button>
      <button id="inc">+ Add</button>
      <button id="reset" class="secondary">Reset</button>
    </div>

    <a href="https://github.com/your-username/your-repo" target="_blank" rel="noopener">View on GitHub →</a>
  </main>

  <script>
    let count = 0;
    const el = document.getElementById("count");
    const update = () => (el.textContent = count);
    document.getElementById("inc").onclick = () => { count++; update(); };
    document.getElementById("dec").onclick = () => { count--; update(); };
    document.getElementById("reset").onclick = () => { count = 0; update(); };
  </script>
</body>
</html>
